services:
  mock-plc:
    build:
      context: ./mock-plc
      dockerfile: Dockerfile
    ports:
      - "15025:5020"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',5020),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    build:
      context: ./seed
      dockerfile: Dockerfile
    volumes:
      - mapping_data:/data
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MAPPING_FILE: /data/mapping.yaml
      MAPPING_DEFAULT: /app/configs/mapping.yaml
      MODBUS_HOST_OVERRIDE: mock-plc
      MODBUS_PORT_OVERRIDE: "5020"
      JWT_SECRET: modbus-mapping-gateway-demo-secret-32b
    ports:
      - "8175:8080"
    volumes:
      - mapping_data:/data
    depends_on:
      mock-plc:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3175:80"
    depends_on:
      - backend

volumes:
  mapping_data:
